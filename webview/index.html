<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src {{CSP_SOURCE}};">
  <link rel="stylesheet" href="{{STYLE_URI}}">
  <title>JSON Table Editor</title>
</head>
<body>
  <div class="toolbar">
    <button id="add-column">Add Column</button>
    <button id="add-row">Add Row</button>
  </div>
  <table id="json-table">
    <thead><tr>{{HEADERS}}</tr></thead>
    <tbody>{{ROWS}}</tbody>
  </table>

  <dialog id="add-col-dialog">
    <form method="dialog">
      <h3>New column</h3>
      <label>Name <input id="col-name" type="text" required /></label>
      <label>Type
        <select id="col-type">
          <option value="string">string</option>
          <option value="number">number</option>
          <option value="bool">bool</option>
          <option value="object">object</option>
          <option value="array">array</option>
        </select>
      </label>
      <div class="dialog-buttons">
        <button type="submit" value="default">Add</button>
        <button type="button" id="btn-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="{{SCRIPT_URI}}"></script>
</body>
</html>
