<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src {{CSP_SOURCE}};">
  <link rel="stylesheet" href="{{STYLE_URI}}">
  <title>JSON Table Editor</title>
</head>

<body>
  <div class="toolbar">
    <button id="add-column">Add Column</button>
    <button id="add-row">Add Row</button>
    <input id="search-input" type="text" placeholder="Search..." />
    <span id="search-count"></span>
  </div>
  <table id="json-table">
    <thead>
      <tr>{{HEADERS}}</tr>
    </thead>
    <tbody>{{ROWS}}</tbody>
  </table>

  <dialog id="add-col-dialog">
    <form method="dialog">
      <h3>New column</h3>
      <label>Name <input id="col-name" type="text" required /></label>
      <label>Type
        <select id="col-type">
          <option value="string">string</option>
          <option value="number">number</option>
          <option value="bool">bool</option>
          <option value="object">object</option>
          <option value="array">array</option>
        </select>
      </label>
      <div class="dialog-buttons">
        <button type="submit" value="default">Add</button>
        <button type="button" id="btn-cancel-add-col">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-col-dialog">
    <form method="dialog">
      <h3>Do you want delete this column?</h3>
      <div class="dialog-buttons">
        <button type="submit" value="default">Yes</button>
        <button type="button" id="btn-cancel-delete-col">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="ctx-menu" class="ctx-menu" hidden>
    <button data-action="delete">Удалить</button>
    <button data-action="cut">Вырезать <span class="shortcut">Ctrl+X</span></button>
    <button data-action="duplicate-after">Дублировать после <span class="shortcut">Ctrl+D</span></button>
    <button data-action="duplicate-end">Дублировать в конец</button>
    <hr>
    <button data-action="copy-array">Копировать как массив</button>
    <button data-action="copy-objects">Копировать как объекты <span class="shortcut">Ctrl+C</span></button>
    <hr>
    <button data-action="paste">Вставить <span class="shortcut">Ctrl+V</span></button>
  </div>

  <script src="{{SCRIPT_URI}}"></script>
</body>

</html>
